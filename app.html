<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forest Management System</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
:root{
  --bg:#edf5e1; --card:#a3c9a8; --accent:#2e7d32; --muted:#557b55; --danger:#c62828;
  --input-bg:#dcedc8; --input-border:#8bbf8b; font-family:Inter,system-ui,sans-serif;
}
body, html{margin:0;padding:0;height:100%;background:var(--bg);color:#1b3a1b;}
button{cursor:pointer;transition:0.2s;}
button:hover{opacity:0.9;}
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:1000;}
.modal .card{background:var(--card);padding:40px;border-radius:16px;width:360px;display:flex;flex-direction:column;gap:20px;box-shadow:0 10px 25px rgba(0,0,0,0.3);}
.modal h2{text-align:center;margin:0;color:var(--accent);}
.modal input{padding:12px;border-radius:8px;border:1px solid var(--input-border);background:var(--input-bg);color:#1b3a1b;width:100%;}
.modal button{padding:12px;border-radius:8px;border:none;background:var(--accent);color:#edf5e1;font-weight:600;}
.modal .link{text-align:center;color:var(--accent);cursor:pointer;font-size:0.9rem;}
.container{display:grid;grid-template-columns:2fr 1fr;gap:20px;padding:20px;max-width:1400px;margin:0 auto;}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
h1,h3{margin:0;}
.panel{background:#dcedc8;padding:12px;border-radius:12px;box-shadow:0 6px 18px rgba(0,0,0,0.2);margin-bottom:12px;color:#1b3a1b;}
input, select, button{padding:8px;border-radius:8px;border:1px solid var(--input-border);background:var(--input-bg);color:#1b3a1b;}
#map{height:400px;border-radius:8px;margin-top:8px;}
#usersList .user-item{display:flex;justify-content:space-between;align-items:center;padding:6px;border-radius:8px;background:rgba(46,125,50,0.1);margin-top:6px;}
.slider-label{display:flex;justify-content:space-between;margin-top:6px;font-size:0.85rem;color:var(--muted);}
#uploadedImage{width:100%;border-radius:8px;margin-top:8px;max-height:400px;object-fit:contain;}
</style>
</head>
<body>

<!-- Login/Register Modal -->
<div id="modal" class="modal">
  <div class="card" id="loginCard">
    <h2>Login</h2>
    <input id="loginUsername" placeholder="Username">
    <input id="loginPassword" type="password" placeholder="Password">
    <button id="loginBtn">Login</button>
    <div class="link" onclick="showRegister()">New user? Register</div>
  </div>
  <div class="card" id="registerCard" style="display:none;">
    <h2>Register</h2>
    <input id="regUsername" placeholder="Username">
    <input id="regPassword" type="password" placeholder="Password">
    <input id="regKey" placeholder="Admin Key (optional)">
    <button id="registerBtn">Register</button>
    <div class="link" onclick="showLogin()">Already have an account? Login</div>
  </div>
</div>

<!-- Main Dashboard -->
<div class="container" id="dashboard" style="display:none;">
  <div>
    <header>
      <h1>Forest Management System</h1>
      <button onclick="logout()">Logout</button>
    </header>

    <section class="panel">
      <h3>Upload Image for Change Detection</h3>
      <input type="file" id="imageUpload" accept="image/*">
      <img id="uploadedImage" src="" alt="Uploaded Image" style="display:none;">
    </section>

    <section class="panel">
      <h3>Change Detection Thresholds</h3>
      <div class="slider-label"><span>Min Change %</span><span id="minThresholdVal">10</span>%</div>
      <input type="range" id="minThreshold" min="0" max="100" value="10">
      <div class="slider-label"><span>Max Change %</span><span id="maxThresholdVal">50</span>%</div>
      <input type="range" id="maxThreshold" min="0" max="100" value="50">
      <button id="runDetection">Run Change Detection</button>
      <button id="exportGeojson">Export GeoJSON</button>
    </section>
  </div>

  <div>
    <section class="panel">
      <h3>Map & AOI Selection</h3>
      <div id="map"></div>
      <p style="font-size:0.85rem;color:var(--muted)">Drag mouse on map to create AOI rectangle. Uploaded image will overlay here.</p>
    </section>

    <section class="panel" id="adminSection">
      <h3>Users</h3>
      <div id="usersList"></div>
    </section>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// -------------------- USER AUTH --------------------
const LS_USERS='fms_users_v2';
function showRegister(){ document.getElementById('loginCard').style.display='none'; document.getElementById('registerCard').style.display='flex'; }
function showLogin(){ document.getElementById('loginCard').style.display='flex'; document.getElementById('registerCard').style.display='none'; }

document.getElementById('registerBtn').addEventListener('click',()=>{
  const u=document.getElementById('regUsername').value.trim();
  const p=document.getElementById('regPassword').value.trim();
  const key=document.getElementById('regKey').value.trim();
  if(!u||!p){ alert('Enter username & password'); return; }
  let role='user'; if(key==='ADMIN123'){ role='admin'; }
  let users=JSON.parse(localStorage.getItem(LS_USERS)||'[]');
  if(users.find(x=>x.username===u)){ alert('Username exists'); return; }
  users.push({username:u,password:p,role}); localStorage.setItem(LS_USERS,JSON.stringify(users));
  alert(`Registered as ${role}`); showLogin();
});

document.getElementById('loginBtn').addEventListener('click',()=>{
  const u=document.getElementById('loginUsername').value.trim();
  const p=document.getElementById('loginPassword').value.trim();
  let users=JSON.parse(localStorage.getItem(LS_USERS)||'[]');
  const user=users.find(x=>x.username===u);
  if(!user){ alert('User not found'); return; }
  if(user.password!==p){ alert('Incorrect password'); return; }
  localStorage.setItem('currentUser',JSON.stringify(user));
  document.getElementById('modal').style.display='none';
  document.getElementById('dashboard').style.display='grid';
  initDashboard(user);
});
function logout(){ localStorage.removeItem('currentUser'); location.reload(); }

// -------------------- DASHBOARD --------------------
function initDashboard(currentUser){
  const usersList=document.getElementById('usersList');
  let AOI=null;
  let imageOverlay=null;

  // -------------------- MAP --------------------
  const map=L.map('map').setView([20.5937,78.9629],5);

  // OpenStreetMap tiles
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    maxZoom:19,
    attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
  }).addTo(map);

  // AOI rectangle drawing
  let startLatLng=null;
  let tempRect=null;
  map.on('mousedown', e => { startLatLng=e.latlng; });
  map.on('mousemove', e=>{
    if(!startLatLng) return;
    if(tempRect) map.removeLayer(tempRect);
    const bounds=[startLatLng, e.latlng];
    tempRect=L.rectangle(bounds,{color:"#2e7d32",weight:2,fillOpacity:0.1}).addTo(map);
  });
  map.on('mouseup', e=>{
    if(tempRect){ 
      AOI=tempRect.getBounds(); 
      tempRect=null; 
      // Update image overlay if uploaded
      if(document.getElementById('uploadedImage').src){
        if(imageOverlay) map.removeLayer(imageOverlay);
        imageOverlay=L.imageOverlay(document.getElementById('uploadedImage').src, AOI,{opacity:0.6}).addTo(map);
      }
    }
    startLatLng=null;
  });

  // -------------------- USERS PANEL --------------------
  function renderUsers(){
    usersList.innerHTML='';
    if(currentUser.role!=='admin'){ document.getElementById('adminSection').style.display='none'; return; }
    let allUsers=JSON.parse(localStorage.getItem(LS_USERS)||'[]');
    allUsers.forEach(u=>{
      const div=document.createElement('div'); div.className='user-item';
      div.textContent=u.username+' ('+u.role+')';
      usersList.appendChild(div);
    });
  }
  renderUsers();

  // -------------------- IMAGE UPLOAD --------------------
  const imageUpload=document.getElementById('imageUpload');
  const uploadedImage=document.getElementById('uploadedImage');
  imageUpload.addEventListener('change',(e)=>{
    const file=e.target.files[0];
    if(!file) return;
    const url=URL.createObjectURL(file);
    uploadedImage.src=url; uploadedImage.style.display='block';
    // Overlay immediately if AOI exists
    if(AOI){
      if(imageOverlay) map.removeLayer(imageOverlay);
      imageOverlay=L.imageOverlay(url, AOI,{opacity:0.6}).addTo(map);
    }
  });

  // -------------------- CHANGE DETECTION --------------------
  const minThreshold=document.getElementById('minThreshold'); const maxThreshold=document.getElementById('maxThreshold');
  const minValEl=document.getElementById('minThresholdVal'); const maxValEl=document.getElementById('maxThresholdVal');
  minThreshold.addEventListener('input',()=>{ minValEl.textContent=minThreshold.value; });
  maxThreshold.addEventListener('input',()=>{ maxValEl.textContent=maxThreshold.value; });

  document.getElementById('runDetection').addEventListener('click',()=>{
    if(!uploadedImage.src){ alert('Upload an image first'); return; }
    if(!AOI){ alert('Select AOI on the map first'); return; }
    const bounds=AOI.toBBoxString();
    alert(`Simulated Change Detection in AOI ${bounds} from ${minThreshold.value}% to ${maxThreshold.value}%`);
  });

  document.getElementById('exportGeojson').addEventListener('click',()=>{
    const data={
      AOI: AOI?AOI.toBBoxString():'none',
      uploadedImage: uploadedImage.src||null,
      minThreshold:minThreshold.value,
      maxThreshold:maxThreshold.value
    };
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='forest_data.geojson'; a.click();
  });
}
</script>
</body>
</html>
